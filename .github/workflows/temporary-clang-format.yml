name: Temporary clang-format

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format
      - name: Format changed C++ files
        run: clang-format -i tools/inspection_commands.h test/inspection_commands_test.cpp
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/inspection_commands.h test/inspection_commands_test.cpp
          git commit -m "style: apply clang-format to inspection command layer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
