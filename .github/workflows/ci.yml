name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.jpg'
      - '**.png'
      - '**.gif'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.jpg'
      - '**.png'
      - '**.gif'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: Check source file sizes
        shell: bash
        run: |
          set -euo pipefail
          MAX_LINES=1500
          FAILED=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "ERROR: $file has $lines lines (max: $MAX_LINES)"
              FAILED=1
            fi
          done < <(find src include adapters -type f \( -name '*.cpp' -o -name '*.h' \) -print)
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Reject removed semantic side-channels
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'resolve_operator|func_def|param_stack' src include; then
            echo "ERROR: removed JSON semantic side-channel found in production sources"
            exit 1
          fi

      - name: Reject removed rel_t storage path
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\brel_t\b|legacy_json_compat|UnitedMemoryLinks' src include CMakeLists.txt; then
            echo "ERROR: removed pointer-based rel_t storage path found in production/build sources"
            exit 1
          fi

      - name: Enforce RawCarrier isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '#include "avm/|nlohmann|[Aa]num|[Aa]bit' include/avm/raw_carrier.h; then
            echo "ERROR: RawCarrier must remain independent of AVM semantic/protocol layers"
            exit 1
          fi

      - name: Enforce external protocol-parser boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '#include.*([Aa]num|[Aa]bit)|anum_parser|AnumParser|[Aa]bits?' src include/avm; then
            echo "ERROR: Anum grammar/parser coupling must stay outside AVM production core"
            exit 1
          fi

      - name: Enforce structural-only Anum adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'parse_raw_quaternary|validate_anum[[:space:]]*\(|project_anum|IncrementalQuaternaryDecoder|RecursiveAnumTree|decode_recursive|rootOpeningCollapse|ProjectionContext|\bAbit\b' adapters; then
            echo "ERROR: AVM Anum adapter must consume canonical denotation only, never parse/project raw Anum"
            exit 1
          fi
          if grep -R -n -E 'nlohmann|json\.hpp' adapters; then
            echo "ERROR: production Anum adapter must remain JSON-free; JSON is test-only conformance loading"
            exit 1
          fi

      - name: Reject removed protocol-only Anum bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'AnumL3Projection|AnumProjectionKind|AnumProtocolValue|anum_projection_bridge' adapters test CMakeLists.txt; then
            echo "ERROR: removed protocol-only Anum bridge found; structural denotation is the sole L3-to-L4 path"
            exit 1
          fi

      - name: Enforce read-only Relations query layer
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '(intern|create_point)[[:space:]]*\(|store\.size[[:space:]]*\(' include/avm/relations_query.h; then
            echo "ERROR: Relations queries must not materialize links or guess full-store enumeration"
            exit 1
          fi
          if grep -n -E 'PersistentLinkStore|InMemoryLinkStore|nlohmann|json\.hpp|[Aa]num' include/avm/relations_query.h; then
            echo "ERROR: Relations query layer must depend only on the LinkStore/Relations Model contracts"
            exit 1
          fi

      - name: Verify public version contract
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(sed -nE 's/^set\(CMAKE_PROJECT_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' CMakeLists.txt)
          header_version=$(sed -nE 's/^inline constexpr std::string_view version_string = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' include/avm/version.h)
          header_major=$(sed -nE 's/^inline constexpr int version_major = ([0-9]+);$/\1/p' include/avm/version.h)
          header_minor=$(sed -nE 's/^inline constexpr int version_minor = ([0-9]+);$/\1/p' include/avm/version.h)
          header_patch=$(sed -nE 's/^inline constexpr int version_patch = ([0-9]+);$/\1/p' include/avm/version.h)
          header_numeric="${header_major}.${header_minor}.${header_patch}"

          test -n "$project_version"
          test "$project_version" = "$header_version"
          test "$project_version" = "$header_numeric"

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            test "v${project_version}" = "${GITHUB_REF_NAME}"
          fi

      - name: Check AVM formatting
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version
          clang-format --dry-run --Werror \
            include/avm/*.h \
            adapters/anum_denotation_bridge.h \
            src/cli.cpp \
            test/assertions_enabled_test.cpp \
            test/link_store_test.cpp \
            test/relations_model_test.cpp \
            test/relations_query_test.cpp \
            test/executor_test.cpp \
            test/program_model_test.cpp \
            test/boolean_runtime_test.cpp \
            test/function_runtime_test.cpp \
            test/frame_runtime_test.cpp \
            test/deferred_definition_test.cpp \
            test/projection_test.cpp \
            test/raw_carrier_test.cpp \
            test/protocol_adapter_boundary_test.cpp \
            test/persistent_link_store_test.cpp \
            test/vertical_slice_test.cpp \
            test/json_value_codec_test.cpp \
            test/json_projection_test.cpp \
            test/json_session_test.cpp \
            test/anum_denotation_bridge_test.cpp \
            test/package_consumer/main.cpp

  core:
    name: Core C++20 / warnings-as-errors
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure core and Anum adapter build
        run: >-
          cmake -S . -B build-core
          -DCMAKE_BUILD_TYPE=Debug
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=ON
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=ON
          -DAVM_WARNINGS_AS_ERRORS=ON

      - name: Build core and Anum adapter tests
        run: cmake --build build-core --target avm_core_tests avm_anum_adapter_tests --parallel

      - name: Run core and Anum adapter tests
        run: ctest --test-dir build-core --output-on-failure

  package-consumer:
    name: Installed package consumer / ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure install tree
        run: >-
          cmake -S . -B build-install
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF

      - name: Install public package
        run: cmake --install build-install --config Release

      - name: Configure external consumer
        run: >-
          cmake -S test/package_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
          -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF

      - name: Build external consumer
        run: cmake --build build-consumer --config Release --parallel

      - name: Run external consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure

  json-compat:
    name: JSON projection + session / warnings-as-errors
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure JSON compatibility build
        run: >-
          cmake -S . -B build-json
          -DCMAKE_BUILD_TYPE=Debug
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=ON
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON

      - name: Build JSON compatibility tests
        run: cmake --build build-json --target avm_json_compat_tests --parallel

      - name: Run JSON compatibility tests
        run: ctest --test-dir build-json --output-on-failure

  cli-roundtrip:
    name: CLI + JSON roundtrip / warnings-as-errors
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CLI build
        run: >-
          cmake -S . -B build-cli
          -DCMAKE_BUILD_TYPE=Debug
          -DAVM_BUILD_CLI=ON
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON

      - name: Build CLI
        run: cmake --build build-cli --target avm --parallel

      - name: Run JSON roundtrip fixtures
        run: ctest --test-dir build-cli --output-on-failure

  sanitizers:
    name: Core + JSON + Anum adapter ASan + UBSan
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=ON
          -DAVM_BUILD_JSON_COMPAT_TESTS=ON
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=ON
          -DAVM_WARNINGS_AS_ERRORS=ON
          -DAVM_ENABLE_SANITIZERS=ON

      - name: Build sanitizer tests
        run: cmake --build build-sanitizers --target avm_core_tests avm_json_compat_tests avm_anum_adapter_tests --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  portable:
    name: Portable / ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure full build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAVM_BUILD_CLI=ON
          -DAVM_BUILD_CORE_TESTS=ON
          -DAVM_BUILD_JSON_COMPAT_TESTS=ON
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run all tests
        run: ctest --test-dir build -C Release --output-on-failure

  release-artifact:
    name: Tagged Linux artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, package-consumer, json-compat, cli-roundtrip, sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure release build
        run: >-
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DAVM_BUILD_CLI=ON
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF

      - name: Build AVM executable
        run: cmake --build build-release --target avm --parallel

      - name: Upload tagged executable
        uses: actions/upload-artifact@v4
        with:
          name: avm-${{ github.ref_name }}-linux-x86_64
          path: build-release/avm
          if-no-files-found: error
