name: Temporary Russian headings normalization

on:
  push:
    branches: [agent/russian-docs-rest]
    paths:
      - '.github/workflows/temporary-russian-headings.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/russian-docs-rest
      - name: Normalize headings
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "## Backends": "## Физические backends",
              "## Bootstrap boundary": "## Граница bootstrap",
              "## Bootstrap vocabulary": "## Bootstrap-словарь",
              "## Lazy IF": "## Ленивый IF",
              "## Bindings": "## Связывания (bindings)",
              "## Call frames": "## Кадры вызова (call frames)",
              "## Persistence": "## Хранение и persistence",
              "## Differential corpus": "## Дифференциальный корпус",
              "## Non-goals": "## Явные ограничения",
          }

          files = [Path("README.md"), Path("analysis.md"), Path("plan.md")]
          files.extend(sorted(Path("docs").glob("*.md")))
          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old + "\n", new + "\n")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Normalized:", ", ".join(changed) if changed else "none")
      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md analysis.md plan.md docs
          git commit -m "docs: нормализовать русские заголовки"
          git push origin HEAD:agent/russian-docs-rest
