name: AVM Showcase

on:
  pull_request:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'examples/showcase/**'
      - 'include/avm/execution_observer.h'
      - 'include/avm/execution_trace.h'
      - 'include/avm/executor.h'
      - 'include/avm/relations_model.h'
      - 'include/avm/semantic_context.h'
      - 'include/avm/triune_primitives.h'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Showcase formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format
      - name: Check showcase formatting
        run: >-
          find examples/showcase -maxdepth 1 -type f
          \( -name '*.cpp' -o -name '*.h' \) -print0
          | xargs -0 clang-format --dry-run --Werror

  linux:
    name: Showcase / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install window-system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorg-dev libgl1-mesa-dev xvfb xdotool imagemagick
      - name: Configure
        run: >-
          cmake -S . -B build-showcase
          -DCMAKE_BUILD_TYPE=Release
          -DAVM_BUILD_IMGUI_DEMO=ON
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-showcase --target avm_showcase --parallel
      - name: Run calculator demo and capture real UI
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$PWD/build-showcase/showcase-artifacts"
          mkdir -p "$output_dir"
          binary=$(find build-showcase -type f -name avm_showcase -perm -111 -print -quit)
          test -n "$binary"
          binary="$PWD/$binary"

          xvfb-run -a --server-args="-screen 0 1600x1000x24" bash -c '
            set -euo pipefail
            export LIBGL_ALWAYS_SOFTWARE=1
            binary="$1"
            output_dir="$2"
            log="$output_dir/calculator-basic.log"

            "$binary" --demo calculator-basic >"$log" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT

            window=""
            for _ in $(seq 1 100); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log"
                exit 1
              fi
              window=$(xdotool search --name "AVM Showcase" 2>/dev/null | head -n 1 || true)
              if [ -n "$window" ]; then
                break
              fi
              sleep 0.1
            done
            test -n "$window"
            xdotool windowmove "$window" 0 0 || true
            sleep 1

            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi

            import -display "$DISPLAY" -window root "$output_dir/avm-showcase-calculator-basic.png"
            test -s "$output_dir/avm-showcase-calculator-basic.png"
            identify "$output_dir/avm-showcase-calculator-basic.png"
          ' _ "$binary" "$output_dir"

          file "$output_dir/avm-showcase-calculator-basic.png"
      - name: Upload calculator showcase evidence
        uses: actions/upload-artifact@v4
        with:
          name: avm-showcase-calculator-basic
          path: |
            build-showcase/showcase-artifacts/avm-showcase-calculator-basic.png
            build-showcase/showcase-artifacts/calculator-basic.log
          if-no-files-found: error

  windows:
    name: Showcase / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-showcase
          -DAVM_BUILD_IMGUI_DEMO=ON
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-showcase --config Release --target avm_showcase --parallel
