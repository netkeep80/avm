name: AVM Showcase

on:
  pull_request:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'examples/native-json/**'
      - 'examples/showcase/**'
      - 'test/native_json_examples_test.cpp'
      - 'include/avm/execution_observer.h'
      - 'include/avm/execution_trace.h'
      - 'include/avm/executor.h'
      - 'include/avm/relations_model.h'
      - 'include/avm/semantic_context.h'
      - 'include/avm/triune_primitives.h'
      - 'adapters/json_duplet_*.h'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Showcase formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format
      - name: Check showcase presentation formatting
        run: >-
          clang-format --dry-run --Werror
          examples/showcase/main.cpp
          examples/showcase/calculator_view.cpp
          examples/showcase/calculator_view.h
          examples/showcase/native_json_view.cpp
          examples/showcase/native_json_view.h
          examples/showcase/showcase_demo.cpp
          examples/showcase/showcase_demo.h
          test/native_json_examples_test.cpp

  linux:
    name: Showcase / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install window-system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorg-dev libgl1-mesa-dev xvfb imagemagick
      - name: Configure
        run: >-
          cmake -S . -B build-showcase
          -DCMAKE_BUILD_TYPE=Release
          -DAVM_BUILD_IMGUI_DEMO=ON
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: >-
          cmake --build build-showcase
          --target avm_showcase avm_native_json_examples_test
          --parallel
      - name: Run Native JSON examples
        run: ctest --test-dir build-showcase -R "^native_json_examples_tests$" --output-on-failure
      - name: Run calculator demo and capture real framebuffer
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$PWD/build-showcase/showcase-artifacts"
          mkdir -p "$output_dir"
          binary=$(find build-showcase -type f -name avm_showcase -perm -111 -print -quit)
          test -n "$binary"
          binary="$PWD/$binary"
          ppm="$output_dir/avm-showcase-calculator-basic.ppm"
          png="$output_dir/avm-showcase-calculator-basic.png"
          log="$output_dir/calculator-basic.log"

          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 AVM_SHOWCASE_SCREENSHOT_PPM="$ppm" \
            "$binary" --demo calculator-basic >"$log" 2>&1

          test -s "$ppm"
          convert "$ppm" "$png"
          test -s "$png"
          dimensions=$(identify -format "%w %h" "$png")
          colors=$(identify -format "%k" "$png")
          echo "screenshot: $dimensions, colors=$colors"
          test "${colors:-0}" -gt 16
          file "$png"
          rm "$ppm"
      - name: Upload calculator showcase evidence
        uses: actions/upload-artifact@v4
        with:
          name: avm-showcase-calculator-basic
          path: |
            build-showcase/showcase-artifacts/avm-showcase-calculator-basic.png
            build-showcase/showcase-artifacts/calculator-basic.log
          if-no-files-found: error

  windows:
    name: Showcase / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-showcase
          -DAVM_BUILD_IMGUI_DEMO=ON
          -DAVM_BUILD_CLI=OFF
          -DAVM_BUILD_CORE_TESTS=OFF
          -DAVM_BUILD_JSON_COMPAT_TESTS=OFF
          -DAVM_BUILD_ANUM_ADAPTER_TESTS=OFF
          -DAVM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: >-
          cmake --build build-showcase --config Release
          --target avm_showcase avm_native_json_examples_test
          --parallel
      - name: Run Native JSON examples
        run: ctest --test-dir build-showcase -C Release -R "^native_json_examples_tests$" --output-on-failure
