name: jsonRVM legacy oracle

on:
  pull_request:
    branches: [main]
    paths:
      - 'compat/jsonrvm-legacy-fixtures/**'
      - 'compat/jsonrvm-golden.json'
      - 'tools/run_jsonrvm_legacy_oracle.py'
      - '.github/workflows/jsonrvm-legacy-oracle.yml'
  workflow_dispatch:

jobs:
  legacy-oracle:
    name: Проверить deterministic legacy semantics
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Получить AVM
        uses: actions/checkout@v4

      - name: Получить pinned jsonRVM
        uses: actions/checkout@v4
        with:
          repository: netkeep80/jsonRVM
          ref: 843b3326141e090ccd1a106ba0a4a21ce72805b7
          path: legacy-jsonrvm

      - name: Проверить provenance jsonRVM
        shell: bash
        run: |
          set -euo pipefail
          expected=843b3326141e090ccd1a106ba0a4a21ce72805b7
          actual=$(git -C legacy-jsonrvm rev-parse HEAD)
          test "$actual" = "$expected"

      - name: Настроить минимальную сборку legacy rmvm
        run: >-
          cmake -S legacy-jsonrvm -B legacy-build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_VOCABULARY=OFF
          -DENABLE_RVM_TEST=OFF

      - name: Собрать legacy rmvm
        run: cmake --build legacy-build --target rmvm --parallel 2

      - name: Выполнить differential oracle cases
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find legacy-build -type f -name rmvm -perm -111 -print -quit)
          test -n "$exe"
          python3 tools/run_jsonrvm_legacy_oracle.py --executable "$exe"
