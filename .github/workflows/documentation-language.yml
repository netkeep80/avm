name: Documentation language

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'analysis.md'
      - 'plan.md'
      - 'docs/**.md'
      - 'tools/validate_documentation_language.py'
      - '.github/workflows/documentation-language.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'analysis.md'
      - 'plan.md'
      - 'docs/**.md'
      - 'tools/validate_documentation_language.py'
      - '.github/workflows/documentation-language.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Проверить русский язык документации
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
      - name: Проверить project-owned Markdown
        run: python3 tools/validate_documentation_language.py
